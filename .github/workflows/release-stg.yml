name: Distribute to testers (release-stg)

# release-stg に入ったコミットを検査し、Firestoreのルール・インデックスと
# Cloud Functions を本番のFirebaseへデプロイし、リリースAPKを
# Firebase App Distribution でテスターへ配布する。
#
# 動かすには README「テスター配布（App Distribution）」の Secrets が要る。
# 足りない場合は最初のステップで、何が足りないかを出して止まる。
#
# aimaru の release-stg.yml を引き継いでいる（リリースノートの組み立て・
# バージョンの自動採番・デプロイの失敗を最後にまとめて知らせる仕組み）。

on:
  push:
    branches: [release-stg]
  workflow_dispatch:
    inputs:
      from_sha:
        description: 'リリースノートの起点コミット（省略時は前回配布地点のタグ stg-distributed を使う）'
        required: false
        default: ''

jobs:
  distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 配布した地点を stg-distributed / v* タグに記録するため
    steps:
      - name: Check required secrets
        id: secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          APP_DISTRIBUTION_TESTERS: ${{ secrets.APP_DISTRIBUTION_TESTERS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in GOOGLE_SERVICES_JSON_BASE64 FIREBASE_SERVICE_ACCOUNT_KEY FIREBASE_PROJECT_ID \
                      FIREBASE_ANDROID_APP_ID APP_DISTRIBUTION_TESTERS ANDROID_KEYSTORE_BASE64 \
                      ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Secretsが足りません::次のSecretsを登録してください:$missing（README「テスター配布（App Distribution）」）"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          # リリースノートは「前回配布した地点からの差分」なので全履歴とタグが要る
          fetch-depth: 0

      # テスターの端末には「何が変わったのか」しか届かないので、前回テスターに
      # 配布したコミット（stg-distributed タグ）からの変更を、コミットの種類ごとに
      # まとめてリリースノートにする。配布に成功したときだけタグを進めるので、
      # 途中で失敗した回の変更も次の配布ノートにまとめて載る。
      - name: Build release notes
        env:
          FROM_SHA: ${{ inputs.from_sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.txt"
          SUBJECTS="$RUNNER_TEMP/subjects.txt"
          MAX_ENTRIES=40

          # 起点として使えるコミットか（存在し、HEADの祖先である）
          resolve_base() {
            local cand="${1:-}" sha
            [ -n "$cand" ] || return 1
            sha=$(git rev-parse -q --verify "${cand}^{commit}" 2>/dev/null) || return 1
            git merge-base --is-ancestor "$sha" HEAD || return 1
            printf '%s' "$sha"
          }

          LAST_VERSION=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 | sed 's/^v//')

          BASE=""
          for cand in "refs/tags/stg-distributed" "refs/tags/v$LAST_VERSION" "$FROM_SHA" "$EVENT_BEFORE"; do
            [ "$cand" != "refs/tags/v" ] || continue
            if BASE=$(resolve_base "$cand"); then
              echo "リリースノートの起点: $cand ($BASE)"
              break
            fi
            BASE=""
          done

          if [ -n "$BASE" ]; then
            git log --no-merges --reverse --format=%s "$BASE..HEAD" > "$SUBJECTS"
          else
            echo "起点が特定できませんでした。直近のコミットを表示します" >&2
            git log --no-merges --reverse --format=%s -n 10 HEAD > "$SUBJECTS"
          fi

          TOTAL=$(wc -l < "$SUBJECTS")
          OMITTED=0
          if [ "$TOTAL" -gt "$MAX_ENTRIES" ]; then
            OMITTED=$((TOTAL - MAX_ENTRIES))
            tail -n "$MAX_ENTRIES" "$SUBJECTS" > "$SUBJECTS.tmp"
            mv "$SUBJECTS.tmp" "$SUBJECTS"
          fi

          # Conventional Commits の接頭辞で種類ごとに束ねる
          FEAT="$RUNNER_TEMP/feat.txt"; FIX="$RUNNER_TEMP/fix.txt"; OTHER="$RUNNER_TEMP/other.txt"
          : > "$FEAT"; : > "$FIX"; : > "$OTHER"
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            target="$OTHER"; label="$subject"
            case "$subject" in
              *:*)
                type=${subject%%:*}
                type=${type%%(*}
                type=${type%!}
                case "$type" in
                  feat) target="$FEAT"; label=${subject#*:} ;;
                  fix) target="$FIX"; label=${subject#*:} ;;
                  chore|docs|refactor|test|ci|perf|build|style|revert)
                    label=${subject#*:} ;;
                esac
                ;;
            esac
            printf -- '- %s\n' "${label# }" >> "$target"
          done < "$SUBJECTS"

          # ---- バージョン採番 ----
          # リリース済みバージョンの正は v* タグ（配布に成功した時だけ打つ）。
          # pubspec.yaml の version は出発点で、人が手で上げた場合はそちらを優先する。
          PUBSPEC_VERSION=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)

          bump() { # $1=x.y.z $2=major|minor|patch
            local ma mi pa
            IFS=. read -r ma mi pa <<< "$1"
            case "$2" in
              major) echo "$((ma + 1)).0.0" ;;
              minor) echo "${ma}.$((mi + 1)).0" ;;
              *)     echo "${ma}.${mi}.$((pa + 1))" ;;
            esac
          }

          VER_BASE=""
          if [ -n "$LAST_VERSION" ]; then
            VER_BASE=$(resolve_base "refs/tags/v$LAST_VERSION") || VER_BASE="$BASE"
          fi

          newest_version=$(printf '%s\n%s\n' "$PUBSPEC_VERSION" "$LAST_VERSION" | sort -V | tail -n 1)

          if [ -z "$LAST_VERSION" ]; then
            APP_VERSION="$PUBSPEC_VERSION"
            REASON="初回リリース（pubspec.yaml の値）"
          elif [ "$PUBSPEC_VERSION" != "$LAST_VERSION" ] && [ "$newest_version" = "$PUBSPEC_VERSION" ]; then
            APP_VERSION="$PUBSPEC_VERSION"
            REASON="pubspec.yaml で手動指定"
          elif [ -n "$VER_BASE" ] && [ "$(git rev-list --no-merges --count "$VER_BASE..HEAD")" -eq 0 ]; then
            APP_VERSION="$LAST_VERSION"
            REASON="変更が無いため据え置き"
          else
            KIND=patch
            if [ -n "$VER_BASE" ]; then
              if git log --format=%s "$VER_BASE..HEAD" | grep -qE '^feat(\(.+\))?!?:'; then
                KIND=minor
              fi
              if git log --format=%B "$VER_BASE..HEAD" | grep -qE '^BREAKING[ -]CHANGE|^[a-z]+(\(.+\))?!:'; then
                KIND=major
              fi
            fi
            APP_VERSION=$(bump "$LAST_VERSION" "$KIND")
            REASON="$LAST_VERSION から $KIND 更新"
          fi
          echo "バージョン: $APP_VERSION ($REASON) / ビルド番号: $BUILD_NUMBER"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          {
            printf '%s\n\n' "${APP_VERSION:-?}"
            [ -n "$BASE" ] || printf '（前回の配布地点が特定できないため、直近の変更を表示しています）\n\n'
          } > "$NOTES_FILE"

          append_section() {
            if [ -s "$2" ]; then
              printf '%s\n' "$1" >> "$NOTES_FILE"
              cat "$2" >> "$NOTES_FILE"
              printf '\n' >> "$NOTES_FILE"
            fi
          }
          append_section "■ 新機能" "$FEAT"
          append_section "■ 修正" "$FIX"
          append_section "■ その他" "$OTHER"

          if [ "$TOTAL" -eq 0 ]; then
            printf '前回の配布からコード変更はありません（再ビルドのみ）。\n\n' >> "$NOTES_FILE"
          fi
          if [ "$OMITTED" -gt 0 ]; then
            printf 'ほか %s 件の変更\n\n' "$OMITTED" >> "$NOTES_FILE"
          fi
          printf 'commit %s\n' "$(git rev-parse --short HEAD)" >> "$NOTES_FILE"

          echo "RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          {
            echo '## テスターに配布するリリースノート'
            echo '```'
            cat "$NOTES_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Androidのビルドは17、Firebaseエミュレータ（ルール・Functionsのテスト）は21を使う
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: flutter pub get

      # google-services.json はAPIキーを含むのでリポジトリに置かず、Secretsから復元する
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      # 検査は署名鍵を展開する前・APKを組む前に置く（壊れているときに早く分かる）
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test security rules
        working-directory: rules_test
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          npm ci && npm test

      - name: Test Cloud Functions
        working-directory: functions
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          npm ci && npm run typecheck && npm test && npm run test:integration

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - run: npm install -g firebase-tools

      # ルール・インデックス・Cloud Functions はリポジトリにあるだけでは本番で動かない
      # （aimaruで、未デプロイのまま画面が無限ローディング・AIが疎通しない状態が続いた）。
      # 検査を通った内容だけをここでデプロイする。
      #
      # continue-on-error: true にしている。一時的な障害でデプロイが失敗しただけで
      # テスターへの配布まで止めないため。失敗はジョブ末尾の
      # 「Fail job if any deploy step did not succeed」でまとめて知らせる。
      - name: Deploy Firestore rules
        id: deploy_rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy --only firestore:rules \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy Firestore indexes
        id: deploy_indexes
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy --only firestore:indexes \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy Cloud Functions
        id: deploy_functions
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy --only functions \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # ビルド番号は実行ごとに一意にする（固定だとFirebaseが同じリリースの上書きと
      # 判定し、テスターに通知が飛ばない）
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number=${{ github.run_number }}

      - name: Distribute to testers via Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID }}" \
            --release-notes-file "$RELEASE_NOTES_FILE" \
            --testers "${{ secrets.APP_DISTRIBUTION_TESTERS }}" \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"

      # ここまで来た＝テスターの手元に届いた地点だけを記録する
      - name: Record distributed commit
        run: |
          git tag -f stg-distributed "$GITHUB_SHA"
          git tag -f "v$APP_VERSION" "$GITHUB_SHA"
          git push -f origin refs/tags/stg-distributed "refs/tags/v$APP_VERSION"

      # 配布は上で完了している。デプロイの失敗を誰にも気づかれない状態に
      # しないためだけに、最後にまとめてジョブを失敗させる
      - name: Fail job if any deploy step did not succeed
        # Secretsが足りずに止まった回は、デプロイの失敗として二重に知らせない
        if: always() && steps.secrets.outcome == 'success'
        run: |
          failed=""
          [ "${{ steps.deploy_rules.outcome }}" = "success" ]     || failed="${failed}Firestore rules, "
          [ "${{ steps.deploy_indexes.outcome }}" = "success" ]   || failed="${failed}Firestore indexes, "
          [ "${{ steps.deploy_functions.outcome }}" = "success" ] || failed="${failed}Cloud Functions, "
          if [ -n "$failed" ]; then
            echo "::error title=本番デプロイに失敗しました::${failed%, } の本番デプロイに失敗しました。テスターへの配布が済んでいても、失敗した対象は本番へ反映されていません。ログを確認してください。"
            exit 1
          fi
